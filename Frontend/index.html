<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>СанАрт — Дашборд</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/pages/dashboard.css" />
</head>
<body>
  <!-- SVG-фильтр для "пиксельных" дисплейных заголовков (используется через .pixel-heading) -->
  <svg width="0" height="0" style="position:absolute">
    <filter id="sanart-pixelate" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div class="app-shell">
    <div id="sidebar-mount"></div>

    <main class="main">
      <div id="topbar-mount"></div>

      <div class="content">
        <section class="content__hero">
          <div>
            <h1 class="pixel-heading dashboard-hero__title">Добро<br />пожаловать</h1>
            <p class="hero__subtitle">Здесь искусство<br />становится ближе</p>
          </div>
          <p class="corner-label content__corner">Больше<br />чем<br />искусство</p>
        </section>

        <div id="dq-banner"></div>

        <section class="dashboard-controls">
          <h2 class="section-title">Общие показатели</h2>
        </section>

        <div class="period-tabs" role="tablist" aria-label="Период">
          <button class="period-tab period-tab--active" data-period="today" type="button">Сегодня</button>
          <button class="period-tab" data-period="yesterday" type="button">Вчера</button>
          <button class="period-tab" data-period="week" type="button">Неделя</button>
          <button class="period-tab" data-period="month" type="button">Месяц</button>
          <button class="period-tab" data-period="quarter" type="button">Квартал</button>
        </div>

        <section class="kpi-grid" id="kpi-grid" aria-label="Ключевые показатели"></section>

        <a class="promo-banner" href="#">
          <span class="promo-banner__bg" aria-hidden="true"></span>
          <span class="promo-banner__content">
            <span class="promo-banner__glyph" style="color:var(--color-text)">
              <svg viewBox="0 0 20 20" width="20" height="20" fill="none"><rect width="8" height="8" fill="currentColor"/><rect x="11" width="4" height="4" fill="currentColor"/><rect y="11" width="4" height="4" fill="currentColor"/></svg>
            </span>
            <span class="pixel-heading promo-banner__heading">Искусство<br />объединяет</span>
          </span>
          <span class="promo-banner__cta">
            Смотреть отчёт
            <span class="promo-banner__cta-icon">
              <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
          </span>
        </a>

        <div class="dash-row dash-row--chart-donut">
          <article class="card">
            <div class="card__header">
              <h3 class="card__title">Посещаемость музея</h3>
              <button class="chart-toolbar" type="button">
                По дням
                <span class="chart-toolbar__chevron">▾</span>
              </button>
            </div>
            <div class="area-chart" id="attendance-chart"></div>
          </article>

          <article class="card">
            <div class="card__header">
              <h3 class="card__title">Источники посещений</h3>
            </div>
            <div id="sources-donut"></div>
          </article>
        </div>

        <div class="dash-row dash-row--three">
          <article class="card">
            <div class="card__header">
              <h3 class="card__title">Популярные экспозиции</h3>
            </div>
            <div class="rank-list" id="popular-exhibitions"></div>
          </article>

          <article class="card">
            <div class="card__header">
              <h3 class="card__title">Возраст посетителей</h3>
            </div>
            <div class="bar-chart" id="age-bar-chart"></div>
          </article>

          <article class="card">
            <div class="card__header">
              <h3 class="card__title">География</h3>
              <a class="card__link" href="#">Смотреть все →</a>
            </div>
            <div class="geo-list" id="geo-list"></div>
          </article>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/components/sidebar.js"></script>
  <script src="assets/js/components/topbar.js"></script>
  <script src="assets/js/components/charts.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
