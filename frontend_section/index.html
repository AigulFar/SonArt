<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>СанАрт — Аналитика для культуры</title>
    <meta name="description" content="Система Big Data аналитики и AI-ассистент для музеев, галерей, библиотек и учреждений культуры. От сырых показателей к управленческим решениям." />
    <meta property="og:title" content="СанАрт — Аналитика для культуры" />
    <meta property="og:description" content="Система Big Data аналитики и AI-ассистент для музеев, галерей, библиотек и учреждений культуры. От сырых показателей к управленческим решениям." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Press+Start+2P&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#f5f5f2] text-[#17171a] antialiased">
    <!-- SVG-фильтр для пиксельных заголовков из дизайна СанАрт -->
    <svg width="0" height="0" style="position:absolute; pointer-events:none">
      <filter id="sanart-pixelate" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
